version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: conversor-backend
    ports:
      - "8000:8000"
    environment:
      - API_KEY=${API_KEY:-demo}
      - CORS_ORIGINS=http://localhost:3000
      - RATE_LIMIT_PER_MINUTE=60
    volumes:
      - ./backend:/app
    networks:
      - conversor-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: conversor-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - conversor-network
    depends_on:
      - backend
    stdin_open: true
    tty: true

networks:
  conversor-network:
    driver: bridge
