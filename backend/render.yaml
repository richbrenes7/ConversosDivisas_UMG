services:
  - type: web
    name: conversor-divisas-backend
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: API_KEY
        value: demo
      - key: CORS_ORIGINS
        # Actualiza esto con tu dominio de Netlify después del despliegue
        value: https://tu-app.netlify.app,http://localhost:3000
      - key: RATE_LIMIT_PER_MINUTE
        value: 60
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0
